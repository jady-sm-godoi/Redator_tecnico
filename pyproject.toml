[project]
name = "redator-tecnico"
version = "0.1.0"
description = "CLI tool that auto-generates technical documentation from GitHub/GitLab repos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=1.0.0",
    "groq>=0.9.0",
    "PyGithub>=2.3.0",
    "python-gitlab>=4.4.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
    "gitpython>=3.1.0",
    "tree-sitter>=0.22.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
doc-rebuild = "redator_tecnico.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-vcr>=1.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
